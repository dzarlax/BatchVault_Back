name: Build and Publish Docker Image

on:
  push:
    branches:
      - main
      - security/2026-10-25-remediation
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'

      - name: Download Go modules
        run: go mod download

      - name: Race tests
        run: go test -race -count=1 ./...

      - name: Vet
        run: go vet ./...

      - name: Build
        run: CGO_ENABLED=0 go build ./...

      - name: Verify modules
        run: go mod verify

  publish:
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/security/2026-10-25-remediation')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare image tags
        id: image-tags
        run: |
          {
            echo 'tags<<EOF'
            echo "ghcr.io/dzarlax/jerky-vault-back:${GITHUB_SHA}"
            echo "ghcr.io/dzarlax/batchvault-back:${GITHUB_SHA}"
            if [ "$GITHUB_REF" = 'refs/heads/main' ]; then
              echo 'ghcr.io/dzarlax/jerky-vault-back:latest'
              echo 'ghcr.io/dzarlax/batchvault-back:latest'
            fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.image-tags.outputs.tags }}
          file: Dockerfile
